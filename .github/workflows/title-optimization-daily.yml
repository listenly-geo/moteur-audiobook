name: Title Optimization — Titres courts + data

on:
  schedule:
    - cron: "10 6 * * *"  # 6h10 UTC (après GSC pull à 6h)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimize-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Optimize titles
        run: python3 automation/scripts/optimize_titles.py

      - name: Commit & Push
        run: |
          git config user.name "title-bot"
          git config user.email "actions@github.com"
          git add data/optimized_titles.json
          git diff --staged --quiet || (git commit -m "data: optimized titles $(date +%Y-%m-%d)" && git push)
