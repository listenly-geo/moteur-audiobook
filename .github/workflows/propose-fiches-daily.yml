name: Proposition — Top 5 fiches quotidiennes

on:
  schedule:
    - cron: "30 11 * * *"  # 11h30 UTC (13h30 Berlin, après title optimization)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  propose-fiches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Propose top 5 fiches + soumission Google
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 automation/scripts/propose_fiches_final.py

      - name: Commit & Push
        run: |
          git config user.name "proposal-bot"
          git config user.email "actions@github.com"
          git add automation/state/proposed_history.json
          git diff --staged --quiet || (git commit -m "data: proposition quotidienne $(date +%Y-%m-%d) - top 5 fiches" && git push)
