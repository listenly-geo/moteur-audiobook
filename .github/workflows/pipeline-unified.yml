name: Pipeline UNIFIÉE - Analyse → Scoring → Proposition

on:
  schedule:
    - cron: "30 6 * * *"  # 6h30 UTC chaque jour (8h30 Berlin)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Run unified pipeline
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 automation/scripts/propose_fiches_unified.py

      - name: Commit results
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@github.com"
          git add data/ automation/state/
          git diff --staged --quiet && echo "Rien de nouveau" || (git commit -m "chore: pipeline unifiée $(date +%Y-%m-%d) - analyse GSC → scoring → proposition" && git push)
