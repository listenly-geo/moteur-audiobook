name: Moteur Audiobook - Génération fiches

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"  # tous les jours 6h UTC -- 1 fiche/jour (stock ou minage), voir generate_audiobook_fiches.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install requests

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RSS_URL: 'https://www.arteradio.com/xml_sound_serie?seriename=%22BOOKMAKERS%22'
          PODCAST_NAME: "Bookmakers"
          SITE_BASE_URL: "https://audiobooklab.fr/blog-audiobook/"
          CTA_URL_BASE: "https://audiobooklab.org/"
          MAX_EPISODES_PER_RUN: "2"
        run: python automation/scripts/generate_audiobook_fiches.py

      - name: Générer l'index des fiches
        run: python3 automation/scripts/generate_fiches_index.py

      - name: Commit fiches + sitemap générés
        run: |
          git config user.name "moteur-audiobook-bot"
          git config user.email "actions@github.com"
          git add pages/moteur-audiobook automation/state pages/moteur-audiobook/dashboard
          git diff --staged --quiet && echo "Rien de nouveau à committer" || git commit -m "feat: nouvelles fiches audiobook + sitemap"
          git push

      - name: Déploiement FTP vers audiobooklab.fr/blog-audiobook
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./pages/moteur-audiobook/
          server-dir: ./audiobooklab.fr/blog-audiobook/
          exclude: |
            **/robots-fragment.txt

      - name: Déploiement robots.txt à la racine du domaine
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./root-files/
          server-dir: ./audiobooklab.fr/
