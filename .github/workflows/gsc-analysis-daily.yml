name: GSC Analysis - Analyse quotidienne audiobook

on:
  schedule:
    - cron: "0 7 * * *"  # 7h UTC chaque jour (9h Berlin)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 google-auth-oauthlib requests

      - name: Run GSC analysis
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 automation/scripts/gsc_analysis.py

      - name: Commit results
        run: |
          git config user.name "gsc-analysis-bot"
          git config user.email "actions@github.com"
          git add data/gsc/
          git diff --staged --quiet && echo "Rien de nouveau" || (git commit -m "chore: analyse GSC quotidienne $(date +%Y-%m-%d)" && git push)
