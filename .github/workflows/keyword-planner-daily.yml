name: Keyword Planner — Volume recherche quotidien

on:
  schedule:
    - cron: "0 6 * * *"  # 6h UTC chaque jour (8h Berlin)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keyword-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract question seeds
        id: seeds
        run: |
          python3 << 'EOF'
          import json

          # Charge les questions stock
          with open('automation/state/question_stock.json') as f:
            questions = json.load(f)

          # Extrait les questions pour Google Ads
          seeds = [q['question']['question'] for q in questions]

          # Sauvegarde pour utilisation dans la prochaine step
          with open('seeds.json', 'w') as f:
            json.dump(seeds, f)
          EOF

      - name: Run Keyword Planner
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          python3 << 'EOF'
          import json, sys

          seeds = json.load(open('seeds.json'))
          sys.argv = ['keyword_planner_audiobook.py'] + seeds
          exec(open('automation/scripts/keyword_planner_audiobook.py').read())
          EOF

      - name: Commit & Push
        run: |
          git config user.name "keyword-bot"
          git config user.email "actions@github.com"
          git add data/keyword_planner.json
          git diff --staged --quiet || (git commit -m "data: keyword planner $(date +%Y-%m-%d)" && git push)
